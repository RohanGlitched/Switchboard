services:
  - type: web
    name: switchboard
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn switchboard.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_BEARER_TOKEN_BEDROCK
        sync: false
